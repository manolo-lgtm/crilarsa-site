# Control de calidad y publicación de crilarsa.com.
# La publicación (deploy) solo corre si TODAS las pruebas pasan. Si algo falla, el sitio publicado no cambia.
name: Pruebas y publicación

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Archivos que no deben estar en el sitio público
        run: |
          bad=$(find . -path ./.git -prune -o -path ./_build -prune -o -type f \( -name '*.bak' -o -name '*.env' -o -name '.env*' -o -name '*.csv' -o -name '*.xlsx' -o -name '*.xls' -o -name '*.pem' -o -name '*.key' -o -name '*.sql' \) -print)
          if [ -n "$bad" ]; then echo "Archivos no permitidos:"; echo "$bad"; exit 1; fi

      - name: Credenciales o correos no autorizados
        run: |
          if grep -RInE --exclude-dir=.git --exclude-dir=node_modules --exclude=site.yml \
            'manolo@alfka|BEGIN (RSA|OPENSSH|EC) PRIVATE KEY|AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{36}|github_pat_[A-Za-z0-9_]{40,}|sk-[A-Za-z0-9]{32,}|AIza[0-9A-Za-z_-]{35}' . ; then
            echo "Se encontró un posible secreto o un correo no autorizado."; exit 1; fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar herramientas de prueba
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Pruebas de extremo a extremo (escritorio y móvil)
        run: npx playwright test

      - name: Informe de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informe-pruebas
          path: playwright-report
          retention-days: 14

  visual:
    # Regresión visual: informa diferencias, no bloquea la publicación. Las referencias nuevas se guardan en el repositorio.
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar herramientas
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Comparar con las referencias visuales
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then npx playwright test -c playwright.visual.config.js --update-snapshots; else npx playwright test -c playwright.visual.config.js; fi
      - name: Informe visual
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informe-visual
          path: |
            informe-visual
            test-results
          retention-days: 14
      - name: Guardar referencias nuevas
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/visual/referencias || true
          if ! git diff --cached --quiet; then git commit -m "Referencias visuales" && (git pull --rebase && git push) || true; fi

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Armar solo los archivos públicos
        run: |
          mkdir _site
          rsync -a ./ _site/ --exclude .git --exclude .github --exclude _site --exclude _build --exclude tests \
            --exclude node_modules --exclude package.json --exclude package-lock.json --exclude playwright.config.js \
            --exclude CLAUDE.md --exclude playwright-report --exclude test-results
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
